<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../css/BoxDesign.css">
    <link rel="stylesheet" href="../../css/Chara_Design.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <title>データベースとは</title>
    <h1 class="title02">データベース</h1>
    <h2 class="border01">ACID特性</h2>
    <table border="2px" bordercolor="white" style="font-size: 20px;">
        <tr>
            <th>特性</th><th>説明</th>
        </tr>
        <tr>
            <td><span class="charCol_sky">A</span>tomicity(原子性)</td><td>トランザクションは完全に実行されるか、<br>全く実行されないかのどちらかとなる性質</td>
        </tr>
        <tr>
            <td><span class="charCol_sky">C</span>onsistency(一貫性)</td><td>トランザクションの実行前後でデータベースの整合性が保たれる性質</td>
        </tr>
        <tr>
            <td><span class="charCol_sky">I</span>solation(独立性)</td><td>トランザクションの処理が<br>他のトランザクションの処理に影響を与えたり受けたりしない性質</td>
        </tr>
        <tr>
            <td><span class="charCol_sky">D</span>urability(永続性)</td><td>トランザクションのコミットにより変更された内容が確実に保存される性質</td>
        </tr>
    </table>
</body>
</html>
